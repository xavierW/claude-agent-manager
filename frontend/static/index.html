<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Agent Manager</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="app">
        <aside id="sidebar">
            <div class="sidebar-header">
                <h1>Claude Chat</h1>
                <button id="new-session-btn" class="btn-primary">+ New Chat</button>
            </div>
            <div id="session-list"></div>
            <div class="sidebar-footer">
                <div id="connection-indicator" class="disconnected"></div>
                <span id="connection-text">Disconnected</span>
            </div>
        </aside>
        <main id="main-content">
            <div id="chat-container">
                <div id="empty-state">
                    <div class="empty-state-icon">&#128172;</div>
                    <h2>Claude Agent Manager</h2>
                    <p>Create a new chat or select an existing one to begin.</p>
                </div>
                <div id="chat-messages" class="hidden"></div>
            </div>
            <div id="input-area" class="hidden">
                <div class="input-wrapper">
                    <textarea id="prompt-input"
                              placeholder="Type your message... (Enter to send, Shift+Enter for new line)"
                              rows="1"></textarea>
                    <button id="send-btn" class="btn-primary" disabled>Send</button>
                    <button id="stop-btn" class="btn-stop hidden" title="Stop generating">&#9632;</button>
                </div>
                <div class="input-hint">Powered by Claude Agent SDK</div>
            </div>
        </main>
    </div>

    <script src="/js/markdown.js"></script>
    <script src="/js/ws.js"></script>
    <script src="/js/session-panel.js"></script>
    <script src="/js/chat-ui.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
